{% extends 'base.html' %}
{% block title %}'Product Update'{% endblock %}

{% block content %}
<section id="form">
    <h1>Update Product</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <label for="images">Images:</label>
        <input type="file" name="images" multiple>
        <button type="submit">Update</button>
    </form>
</section>
{% endblock %}
