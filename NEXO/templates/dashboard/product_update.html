{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate 'Product Update' %}{% endblock %}

{% block content %}
<section id="form">
    <h1>{% translate "Update Product" %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <label for="images">{% translate "Images" %}:</label>
        <input type="file" name="images" multiple>
        <button type="submit">{% translate "Update" %}</button>
    </form>
</section>
{% endblock %}
