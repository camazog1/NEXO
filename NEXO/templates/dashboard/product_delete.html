{% extends 'base.html' %}
{% block title %}'Product Delete'{% endblock %}

{% block content %}
<section id="form">
    <h1>Delete Product</h1>
    <p>Are you sure you want to delete the product "{{ product.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="confirm-button">Yes, Delete</button>
        <a href="{% url 'product_list' %}" class="cancel-button">Cancel</a>
    </form>
</section>
{% endblock %}
